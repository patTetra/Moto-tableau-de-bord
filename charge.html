<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculateur Recharge Moto</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 4px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    .slider-val {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: var(--border);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .segmented-control {
      display: flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .segmented-control button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segmented-control button.active {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .result-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .result-box.full-width {
      grid-column: span 2;
    }

    .result-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .result-value.accent {
      color: var(--accent);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Simulateur de Recharge</h1>
      <p>Batterie 15,3 kWh</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="socCurrent">
          <span>Niveau actuel</span>
          <span class="slider-val" id="socCurrentVal">20 %</span>
        </label>
        <input type="range" id="socCurrent" min="0" max="100" value="20">
      </div>

      <div class="form-group">
        <label for="socTarget">
          <span>Niveau ciblé</span>
          <span class="slider-val" id="socTargetVal">80 %</span>
        </label>
        <input type="range" id="socTarget" min="0" max="100" value="80">
      </div>

      <div class="form-group">
        <label>Mode de charge</label>
        <div class="segmented-control">
          <button id="btnBorne" class="active" onclick="setMode('borne')">Borne Publique</button>
          <button id="btnDomicile" onclick="setMode('domicile')">Domicile (8h)</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="results-grid">
        <div class="result-box">
          <div class="result-label">Temps estimé</div>
          <div class="result-value accent" id="timeRes">0 h 00</div>
        </div>
        <div class="result-box">
          <div class="result-label">Énergie ajoutée</div>
          <div class="result-value" id="kwhRes">0.0 kWh</div>
        </div>
        <div class="result-box full-width">
          <div class="result-label">Fin de charge estimée</div>
          <div class="result-value" id="endTimeRes">--:--</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BATTERY_CAPACITY_KWH = 15.3;
    let currentMode = 'borne';

    const socCurrentInput = document.getElementById('socCurrent');
    const socTargetInput = document.getElementById('socTarget');
    const socCurrentVal = document.getElementById('socCurrentVal');
    const socTargetVal = document.getElementById('socTargetVal');
    const timeRes = document.getElementById('timeRes');
    const kwhRes = document.getElementById('kwhRes');
    const endTimeRes = document.getElementById('endTimeRes');
    const progressFill = document.getElementById('progressFill');

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnBorne').classList.toggle('active', mode === 'borne');
      document.getElementById('btnDomicile').classList.toggle('active', mode === 'domicile');
      calculate();
    }

    function calculateDurationMinutes(startSoc, endSoc, mode) {
      if (startSoc >= endSoc) return 0;

      if (mode === 'domicile') {
        // 0 à 100% en 8h (480 minutes) -> 4.8 min par 1% de SOC
        const minutesPerPercent = 480 / 100;
        return (endSoc - startSoc) * minutesPerPercent;
      } else {
        // Borne Publique
        // Segment 1 (0 -> 80%) : 1h30 (90 min) -> 1.125 min par 1%
        // Segment 2 (80 -> 100%) : 1h00 (60 min) -> 3.0 min par 1%
        let duration = 0;

        // Partie sous 80%
        const startSeg1 = Math.min(startSoc, 80);
        const endSeg1 = Math.min(endSoc, 80);
        if (endSeg1 > startSeg1) {
          duration += (endSeg1 - startSeg1) * (90 / 80);
        }

        // Partie au-dessus de 80%
        const startSeg2 = Math.max(startSoc, 80);
        const endSeg2 = Math.max(endSoc, 80);
        if (endSeg2 > startSeg2) {
          duration += (endSeg2 - startSeg2) * (60 / 20);
        }

        return duration;
      }
    }

    function calculate() {
      let current = parseInt(socCurrentInput.value);
      let target = parseInt(socTargetInput.value);

      // Empêcher la cible d'être inférieure au niveau actuel
      if (target < current) {
        target = current;
        socTargetInput.value = target;
      }

      socCurrentVal.textContent = `${current} %`;
      socTargetVal.textContent = `${target} %`;

      // 1. Durée totale en minutes
      const totalMinutes = Math.round(calculateDurationMinutes(current, target, currentMode));
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      timeRes.textContent = `${hours} h ${mins < 10 ? '0' : ''}${mins}`;

      // 2. Énergie ajoutée
      const socDiff = target - current;
      const kwhAdded = (BATTERY_CAPACITY_KWH * (socDiff / 100)).toFixed(1);
      kwhRes.textContent = `${kwhAdded} kWh`;

      // 3. Heure de fin
      const now = new Date();
      const endTime = new Date(now.getTime() + totalMinutes * 60000);
      const endHours = String(endTime.getHours()).padStart(2, '0');
      const endMins = String(endTime.getMinutes()).padStart(2, '0');
      endTimeRes.textContent = `${endHours}:${endMins}`;

      // Barre visuelle de progression
      progressFill.style.width = `${target}%`;
    }

    socCurrentInput.addEventListener('input', calculate);
    socTargetInput.addEventListener('input', calculate);

    // Initialisation
    calculate();
  </script>
</body>
</html>
