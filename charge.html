<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Rezon Charge</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --accent-red: #e63946;
            --accent-blue: #00b4d8;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2e3646;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        header span {
            color: var(--accent-red);
        }

        /* Nav Mode Tabs */
        .mode-switch {
            background: var(--card-bg);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Segmented Controls */
        .segmented {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 3px;
            gap: 4px;
        }

        .seg-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: 9px;
            transition: background 0.2s, color 0.2s;
        }

        .seg-btn.active {
            background: var(--border-color);
            color: #fff;
        }

        /* Input Controls */
        .range-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .range-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-blue);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        }

        .time-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .number-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            outline: none;
        }

        /* Result Display */
        .result-card {
            background: linear-gradient(135deg, rgba(230,57,70,0.15) 0%, rgba(0,180,216,0.15) 100%);
            border: 1px solid var(--accent-red);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-main {
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
        }

        .result-sub {
            font-size: 14px;
            color: #cbd5e1;
        }

        .badge {
            display: inline-block;
            align-self: center;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>REZON <span>BOHEMIA</span></h1>
    </header>

    <!-- Selecteur de mode principal -->
    <div class="mode-switch">
        <button class="mode-btn active" id="tab-mode1" onclick="switchMode(1)">Temps pour 100%</button>
        <button class="mode-btn" id="tab-mode2" onclick="switchMode(2)">Batterie après X min</button>
    </div>

    <!-- Paramètres partagés (Configuration) -->
    <div class="card">
        <div class="section-label">Configuration de charge</div>
        
        <!-- Solo / Duo -->
        <div class="segmented">
            <button class="seg-btn active" id="btn-solo" onclick="setParam('passenger', 'solo')">👤 Solo (170 km)</button>
            <button class="seg-btn" id="btn-duo" onclick="setParam('passenger', 'duo')">👥 Duo (140 km)</button>
        </div>

        <!-- Borne / Maison -->
        <div class="segmented">
            <button class="seg-btn active" id="btn-borne" onclick="setParam('location', 'borne')">⚡ Borne (2h30)</button>
            <button class="seg-btn" id="btn-maison" onclick="setParam('location', 'maison')">🏠 Maison (4h30)</button>
        </div>
    </div>

    <!-- Formulaire Mode 1: Niveau actuel -> Temps restants -->
    <div class="card" id="form-mode1">
        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Batterie actuelle</span>
                <span class="range-value" id="battery-val">30%</span>
            </div>
            <input type="range" id="battery-range" min="0" max="100" value="30" oninput="updateCalculations()">
        </div>
    </div>

    <!-- Formulaire Mode 2: Batterie + Temps -> Niveau final -->
    <div class="card" id="form-mode2" style="display: none;">
        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Batterie de départ</span>
                <span class="range-value" id="battery-val-m2">30%</span>
            </div>
            <input type="range" id="battery-range-m2" min="0" max="100" value="30" oninput="updateCalculations()">
        </div>

        <div class="range-container">
            <span class="section-label">Temps de charge disponible (minutes)</span>
            <div class="time-input-group">
                <input type="number" id="time-input" class="number-input" value="45" min="1" step="5" oninput="updateCalculations()">
            </div>
        </div>
    </div>

    <!-- Zone de Résultats -->
    <div class="result-card">
        <div class="result-title" id="result-title">Temps de charge requis</div>
        <div class="result-main" id="result-main">1h 45m</div>
        <div class="result-sub" id="result-sub">Fin estimée à 16:15</div>
        <div class="badge" id="result-badge">Autonomie : +119 km (Total 170 km)</div>
    </div>

    <script>
        // Données techniques de la Rezon Bohemia
        const CONFIG = {
            range: { solo: 170, duo: 140 },
            chargeMinutes: { borne: 150, maison: 270 } // 2h30 = 150min, 4h30 = 270min
        };

        let state = {
            mode: 1, // 1: Temps pour 100%, 2: Batterie après X min
            passenger: 'solo',
            location: 'borne'
        };

        function switchMode(newMode) {
            state.mode = newMode;
            document.getElementById('tab-mode1').classList.toggle('active', newMode === 1);
            document.getElementById('tab-mode2').classList.toggle('active', newMode === 2);
            document.getElementById('form-mode1').style.display = newMode === 1 ? 'flex' : 'none';
            document.getElementById('form-mode2').style.display = newMode === 2 ? 'flex' : 'none';
            updateCalculations();
        }

        function setParam(key, value) {
            state[key] = value;
            
            // Mise à jour UI boutons
            if(key === 'passenger') {
                document.getElementById('btn-solo').classList.toggle('active', value === 'solo');
                document.getElementById('btn-duo').classList.toggle('active', value === 'duo');
            } else if(key === 'location') {
                document.getElementById('btn-borne').classList.toggle('active', value === 'borne');
                document.getElementById('btn-maison').classList.toggle('active', value === 'maison');
            }
            updateCalculations();
        }

        function formatMinutes(totalMinutes) {
            const h = Math.floor(totalMinutes / 60);
            const m = Math.round(totalMinutes % 60);
            if (h === 0) return `${m} min`;
            return `${h}h ${m < 10 ? '0' : ''}${m}m`;
        }

        function updateCalculations() {
            const maxRange = CONFIG.range[state.passenger];
            const fullChargeTime = CONFIG.chargeMinutes[state.location];

            if (state.mode === 1) {
                // MODE 1: Calcul du temps jusqu'à 100%
                const currentPct = parseInt(document.getElementById('battery-range').value);
                document.getElementById('battery-val').innerText = `${currentPct}%`;

                const pctToCharge = 100 - currentPct;
                const minutesNeeded = (pctToCharge / 100) * fullChargeTime;

                // Calcul heure de fin
                const now = new Date();
                const endTime = new Date(now.getTime() + minutesNeeded * 60000);
                const endStr = endTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const kmMissing = Math.round((pctToCharge / 100) * maxRange);
                const currentKm = Math.round((currentPct / 100) * maxRange);

                document.getElementById('result-title').innerText = "Temps pour atteindre 100%";
                document.getElementById('result-main').innerText = formatMinutes(minutesNeeded);
                document.getElementById('result-sub').innerText = currentPct === 100 ? "Batterie déjà pleine !" : `Fin estimée à ${endStr}`;
                document.getElementById('result-badge').innerText = `Actuel : ${currentKm} km | À charger : +${kmMissing} km`;

            } else {
                // MODE 2: Calcul du % atteint après X min
                const startPct = parseInt(document.getElementById('battery-range-m2').value);
                document.getElementById('battery-val-m2').innerText = `${startPct}%`;

                const chargeTimeInput = parseInt(document.getElementById('time-input').value) || 0;

                // Calcul du % gagné
                const pctGained = (chargeTimeInput / fullChargeTime) * 100;
                const finalPct = Math.min(100, Math.round(startPct + pctGained));
                
                const finalKm = Math.round((finalPct / 100) * maxRange);
                const gainedKm = Math.round(((finalPct - startPct) / 100) * maxRange);

                document.getElementById('result-title').innerText = "Niveau après la charge";
                document.getElementById('result-main').innerText = `${finalPct}%`;
                document.getElementById('result-sub').innerText = finalPct === 100 ? "Recharge complète !" : `Gain de +${Math.round(pctGained)}% de batterie`;
                document.getElementById('result-badge').innerText = `Autonomie finale : ${finalKm} km (+${gainedKm} km)`;
            }
        }

        // Initialisation au chargement
        updateCalculations();
    </script>
</body>
</html>
