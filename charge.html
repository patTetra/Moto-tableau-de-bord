<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rezon Charge">
    <link id="apple-touch-icon" rel="apple-touch-icon" href="">
    <title>Rezon Charge</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --accent-red: #e63946;
            --accent-blue: #00b4d8;
            --accent-green: #2ec4b6;
            --accent-yellow: #ffb703;
            --accent-purple: #7209b7;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2e3646;
            --battery-color: var(--accent-green);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        header span {
            color: var(--accent-red);
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .mode-switch {
            background: var(--card-bg);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .segmented {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 3px;
            gap: 4px;
        }

        .seg-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: 9px;
            transition: background 0.2s, color 0.2s;
        }

        .seg-btn.active {
            background: var(--border-color);
            color: #fff;
        }

        .range-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .range-value {
            font-size: 28px;
            font-weight: 800;
            transition: color 0.3s ease;
        }

        .battery-gauge-bar {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .battery-gauge-fill {
            height: 100%;
            width: 30%;
            background: var(--battery-color);
            border-radius: 4px;
            transition: width 0.2s ease, background-color 0.3s ease;
        }

        .slider-with-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-step {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-step:active {
            background: var(--accent-blue);
            color: #0b0e14;
        }

        input[type="range"] {
            -webkit-appearance: none;
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        }

        .quick-time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .quick-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-btn:active {
            background: var(--accent-blue);
            color: #0b0e14;
            transform: scale(0.96);
        }

        .number-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            outline: none;
            user-select: text;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(230,57,70,0.15) 0%, rgba(0,180,216,0.15) 100%);
            border: 1px solid var(--accent-red);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.3s ease;
        }

        .result-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-main {
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
        }

        .result-sub {
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Badge cliquable pour basculer Solo / Duo (1.1) */
        .badge-interactive {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: center;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-top: 4px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .badge-interactive:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.25);
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-calendar {
            background: var(--accent-purple);
            box-shadow: 0 4px 12px rgba(114, 9, 183, 0.3);
        }

        /* Bouton Partage SMS / Web Share (2.1) */
        .btn-share {
            background: #25d366;
            color: #0b0e14;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .save-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>REZON <span>BOHEMIA</span></h1>
        <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
    </header>

    <div class="mode-switch">
        <button class="mode-btn active" id="tab-mode1" onclick="switchMode(1)">Temps pour 100%</button>
        <button class="mode-btn" id="tab-mode2" onclick="switchMode(2)">Batterie après X min</button>
    </div>

    <div class="card">
        <div class="section-label">Lieu de charge</div>
        <div class="segmented">
            <button class="seg-btn active" id="btn-borne" onclick="setParam('location', 'borne')">⚡ Borne (2h30)</button>
            <button class="seg-btn" id="btn-maison" onclick="setParam('location', 'maison')">🏠 Maison (8h)</button>
        </div>
    </div>

    <div class="card" id="form-mode1">
        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Batterie actuelle</span>
                <span class="range-value" id="battery-val">30%</span>
            </div>
            <div class="battery-gauge-bar">
                <div class="battery-gauge-fill" id="gauge-m1"></div>
            </div>
            <input type="range" id="battery-range" min="0" max="100" value="30" oninput="updateCalculations()">
        </div>
    </div>

    <div class="card" id="form-mode2" style="display: none;">
        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Batterie de départ</span>
                <span class="range-value" id="battery-val-m2">30%</span>
            </div>
            <div class="battery-gauge-bar">
                <div class="battery-gauge-fill" id="gauge-m2"></div>
            </div>
            <input type="range" id="battery-range-m2" min="0" max="100" value="30" oninput="updateCalculations()">
        </div>

        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Temps disponible</span>
                <span class="range-value" style="color: var(--accent-blue)" id="time-val-display">45m</span>
            </div>
            
            <div class="slider-with-controls">
                <button class="btn-step" onclick="stepTime(-5)">−</button>
                <input type="range" id="time-range" min="5" max="300" step="5" value="45" oninput="updateCalculations()">
                <button class="btn-step" onclick="stepTime(5)">+</button>
            </div>
            
            <div class="quick-time-grid">
                <button class="quick-btn" onclick="setTime(15)">15 min</button>
                <button class="quick-btn" onclick="setTime(30)">30 min</button>
                <button class="quick-btn" onclick="setTime(60)">1 h</button>
                <button class="quick-btn" onclick="setTime(120)">2 h</button>
            </div>
        </div>
    </div>

    <div class="result-card" id="result-card">
        <div class="result-title" id="result-title">Temps de charge requis</div>
        <div class="result-main" id="result-main">1h 45m</div>
        <div class="result-sub" id="result-sub">Fin estimée à 16:15</div>
        <div class="badge-interactive" id="result-badge" onclick="togglePassengerMode()">
            <span id="badge-icon">👤</span> <span id="badge-text">Solo : 170 km</span> 🔄
        </div>
    </div>

    <div class="action-group">
        <button class="btn-action btn-calendar" onclick="createICSAlarm()">
            📅 Rappel iOS (5 min avant)
        </button>

        <button class="btn-action btn-share" onclick="shareChargingStatus()">
            💬 Partager l'heure de fin
        </button>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Réglages Autonomie</h2>
                <button style="background:none;border:none;color:#fff;font-size:20px;" onclick="toggleSettings(false)">✕</button>
            </div>
            <div class="input-row">
                <label style="font-size:13px;color:var(--text-secondary);">Autonomie Solo (km)</label>
                <input type="number" id="cfg-solo" class="number-input" style="font-size: 18px; padding: 8px;" value="170">
            </div>
            <div class="input-row">
                <label style="font-size:13px;color:var(--text-secondary);">Autonomie Duo (km)</label>
                <input type="number" id="cfg-duo" class="number-input" style="font-size: 18px; padding: 8px;" value="140">
            </div>
            <button class="save-btn" onclick="saveSettings()">Enregistrer</button>
        </div>
    </div>

    <script>
        let CONFIG = {
            range: { 
                solo: parseInt(localStorage.getItem('rezon_solo_km')) || 170, 
                duo: parseInt(localStorage.getItem('rezon_duo_km')) || 140 
            }
        };

        let state = { 
            mode: parseInt(localStorage.getItem('rezon_last_mode')) || 1, 
            passenger: localStorage.getItem('rezon_last_passenger') || 'solo', 
            location: localStorage.getItem('rezon_last_location') || 'borne',
            batM1: parseInt(localStorage.getItem('rezon_bat_m1')) || 30,
            batM2: parseInt(localStorage.getItem('rezon_bat_m2')) || 30,
            timeM2: parseInt(localStorage.getItem('rezon_time_m2')) || 45
        };

        let calculatedMinutesNeeded = 0;
        let lastEndFormatted = "";
        let lastTargetPct = 100;
        let lastGainedKm = 0;

        // Génération d'une icône Apple Touch dynamique via Canvas (3.2)
        function generateAppleTouchIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0b0e14';
            ctx.fillRect(0, 0, 180, 180);

            ctx.fillStyle = '#161b26';
            ctx.beginPath();
            ctx.arc(90, 90, 75, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.moveTo(100, 25);
            ctx.lineTo(45, 100);
            ctx.lineTo(85, 100);
            ctx.lineTo(80, 155);
            ctx.lineTo(135, 80);
            ctx.lineTo(95, 80);
            ctx.closePath();
            ctx.fill();

            document.getElementById('apple-touch-icon').href = canvas.toDataURL('image/png');
        }

        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
            if(show) {
                document.getElementById('cfg-solo').value = CONFIG.range.solo;
                document.getElementById('cfg-duo').value = CONFIG.range.duo;
            }
        }

        function saveSettings() {
            const soloVal = parseInt(document.getElementById('cfg-solo').value) || 170;
            const duoVal = parseInt(document.getElementById('cfg-duo').value) || 140;
            CONFIG.range.solo = soloVal;
            CONFIG.range.duo = duoVal;
            localStorage.setItem('rezon_solo_km', soloVal);
            localStorage.setItem('rezon_duo_km', duoVal);
            updateCalculations();
            toggleSettings(false);
        }

        function restoreUIState() {
            document.getElementById('tab-mode1').classList.toggle('active', state.mode === 1);
            document.getElementById('tab-mode2').classList.toggle('active', state.mode === 2);
            document.getElementById('form-mode1').style.display = state.mode === 1 ? 'flex' : 'none';
            document.getElementById('form-mode2').style.display = state.mode === 2 ? 'flex' : 'none';

            document.getElementById('btn-borne').classList.toggle('active', state.location === 'borne');
            document.getElementById('btn-maison').classList.toggle('active', state.location === 'maison');

            document.getElementById('battery-range').value = state.batM1;
            document.getElementById('battery-range-m2').value = state.batM2;
            document.getElementById('time-range').value = state.timeM2;
        }

        function switchMode(newMode) {
            state.mode = newMode;
            localStorage.setItem('rezon_last_mode', newMode);
            restoreUIState();
            updateCalculations();
        }

        function setParam(key, value) {
            state[key] = value;
            if(key === 'location') localStorage.setItem('rezon_last_location', value);
            restoreUIState();
            updateCalculations();
        }

        // Bascule rapide Solo / Duo en tapant sur le badge (1.1)
        function togglePassengerMode() {
            state.passenger = state.passenger === 'solo' ? 'duo' : 'solo';
            localStorage.setItem('rezon_last_passenger', state.passenger);
            updateCalculations();
        }

        function formatMinutes(totalMinutes) {
            const h = Math.floor(totalMinutes / 60);
            const m = Math.round(totalMinutes % 60);
            if (h === 0) return `${m} min`;
            return `${h}h ${m < 10 ? '0' : ''}${m}m`;
        }

        function setTime(mins) {
            const timeSlider = document.getElementById('time-range');
            timeSlider.value = mins;
            updateCalculations();
        }

        function stepTime(delta) {
            const timeSlider = document.getElementById('time-range');
            let val = parseInt(timeSlider.value) || 0;
            val = Math.max(5, Math.min(300, val + delta));
            timeSlider.value = val;
            updateCalculations();
        }

        function applyBatteryColor(elementId, gaugeId, val) {
            const el = document.getElementById(elementId);
            const gauge = document.getElementById(gaugeId);
            const resCard = document.getElementById('result-card');
            
            let color = "var(--accent-green)";
            if (val < 20) color = "var(--accent-red)";
            else if (val <= 50) color = "var(--accent-yellow)";

            el.style.color = color;
            gauge.style.backgroundColor = color;
            gauge.style.width = `${val}%`;
            resCard.style.borderColor = color;
        }

        function getMinutesToCharge(startPct, endPct, location) {
            if (startPct >= endPct) return 0;
            if (location === 'maison') {
                return (endPct - startPct) * 4.8;
            } else {
                let minutes = 0;
                const seg1Start = Math.min(startPct, 80);
                const seg1End = Math.min(endPct, 80);
                if (seg1End > seg1Start) minutes += (seg1End - seg1Start) * (90 / 80);

                const seg2Start = Math.max(startPct, 80);
                const seg2End = Math.max(endPct, 80);
                if (seg2End > seg2Start) minutes += (seg2End - seg2Start) * (60 / 20);

                return minutes;
            }
        }

        function getFinalPctAfterMinutes(startPct, availableMinutes, location) {
            if (location === 'maison') {
                const pctGained = availableMinutes / 4.8;
                return Math.min(100, startPct + pctGained);
            } else {
                let currentSoc = startPct;
                let remainingMins = availableMinutes;

                if (currentSoc < 80) {
                    const minsTo80 = (80 - currentSoc) * 1.125;
                    if (remainingMins <= minsTo80) {
                        return currentSoc + (remainingMins / 1.125);
                    } else {
                        currentSoc = 80;
                        remainingMins -= minsTo80;
                    }
                }

                if (remainingMins > 0 && currentSoc >= 80) {
                    const pctGained = remainingMins / 3.0;
                    currentSoc = Math.min(100, currentSoc + pctGained);
                }

                return currentSoc;
            }
        }

        function updateCalculations() {
            const maxRange = CONFIG.range[state.passenger];
            const isSolo = state.passenger === 'solo';

            if (state.mode === 1) {
                const currentPct = parseInt(document.getElementById('battery-range').value);
                localStorage.setItem('rezon_bat_m1', currentPct);
                document.getElementById('battery-val').innerText = `${currentPct}%`;
                applyBatteryColor('battery-val', 'gauge-m1', currentPct);
                
                calculatedMinutesNeeded = getMinutesToCharge(currentPct, 100, state.location);

                const now = new Date();
                const endTime = new Date(now.getTime() + calculatedMinutesNeeded * 60000);
                lastEndFormatted = endTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const pctToCharge = 100 - currentPct;
                lastGainedKm = Math.round((pctToCharge / 100) * maxRange);
                lastTargetPct = 100;

                document.getElementById('result-title').innerText = "Temps pour atteindre 100%";
                document.getElementById('result-main').innerText = formatMinutes(calculatedMinutesNeeded);
                document.getElementById('result-sub').innerText = currentPct === 100 ? "Batterie déjà pleine !" : `Fin estimée à ${lastEndFormatted}`;
                
                document.getElementById('badge-icon').innerText = isSolo ? "👤" : "👥";
                document.getElementById('badge-text').innerText = `${isSolo ? "Solo" : "Duo"} : +${lastGainedKm} km (Total ${maxRange} km)`;
            } else {
                const startPct = parseInt(document.getElementById('battery-range-m2').value);
                localStorage.setItem('rezon_bat_m2', startPct);
                document.getElementById('battery-val-m2').innerText = `${startPct}%`;
                applyBatteryColor('battery-val-m2', 'gauge-m2', startPct);

                calculatedMinutesNeeded = parseInt(document.getElementById('time-range').value) || 0;
                localStorage.setItem('rezon_time_m2', calculatedMinutesNeeded);
                document.getElementById('time-val-display').innerText = formatMinutes(calculatedMinutesNeeded);

                const finalPctRaw = getFinalPctAfterMinutes(startPct, calculatedMinutesNeeded, state.location);
                const finalPct = Math.round(finalPctRaw);
                const pctGained = Math.max(0, finalPct - startPct);

                const finalKm = Math.round((finalPct / 100) * maxRange);
                lastGainedKm = Math.round((pctGained / 100) * maxRange);
                lastTargetPct = finalPct;

                const now = new Date();
                const endTime = new Date(now.getTime() + calculatedMinutesNeeded * 60000);
                lastEndFormatted = endTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                document.getElementById('result-title').innerText = "Niveau après la charge";
                document.getElementById('result-main').innerText = `${finalPct}%`;
                document.getElementById('result-sub').innerText = `Prête à ${lastEndFormatted} (+${pctGained}% de batterie)`;
                
                document.getElementById('badge-icon').innerText = isSolo ? "👤" : "👥";
                document.getElementById('badge-text').innerText = `${isSolo ? "Solo" : "Duo"} : ${finalKm} km (+${lastGainedKm} km)`;
            }
        }

        // Partage rapide SMS / WhatsApp (2.1)
        async function shareChargingStatus() {
            if (calculatedMinutesNeeded <= 0) return;

            const text = `⚡ Rezon en charge : ${lastTargetPct}% prévus à ${lastEndFormatted} (+${lastGainedKm} km).`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Fin de charge Rezon',
                        text: text
                    });
                } catch (err) {
                    console.log('Partage annulé ou non disponible');
                }
            } else {
                // Secours : Ouverture application SMS native
                window.location.href = `sms:?&body=${encodeURIComponent(text)}`;
            }
        }

        function createICSAlarm() {
            if (calculatedMinutesNeeded <= 0) return;

            const now = new Date();
            const endChargeDate = new Date(now.getTime() + calculatedMinutesNeeded * 60000);
            const alarmDate = new Date(endChargeDate.getTime() - 5 * 60000);

            function formatDate(d) {
                return d.toISOString().replace(/-|:|\.\d+/g, "");
            }

            const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Rezon Bohemia//Charge Tracker//FR
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VEVENT
SUMMARY:⚡ Fin de charge Rezon dans 5 min !
DESCRIPTION:La recharge s'achève à ${endChargeDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.
DTSTART:${formatDate(alarmDate)}
DTEND:${formatDate(endChargeDate)}
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:Fin de charge Rezon dans 5 min !
TRIGGER;VALUE=DATE-TIME:${formatDate(alarmDate)}
END:VALARM
END:VEVENT
END:VCALENDAR`;

            const encodedUri = "data:text/calendar;charset=utf8," + encodeURIComponent(icsData);
            window.location.href = encodedUri;
        }

        generateAppleTouchIcon();
        restoreUIState();
        updateCalculations();
    </script>
</body>
</html>
