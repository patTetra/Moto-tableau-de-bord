<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Rezon Charge</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --accent-red: #e63946;
            --accent-blue: #00b4d8;
            --accent-green: #2ec4b6;
            --accent-purple: #7209b7;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2e3646;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 20px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        header span {
            color: var(--accent-red);
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .mode-switch {
            background: var(--card-bg);
            padding: 4px;
            border-radius: 14px;
            display: flex;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .segmented {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 3px;
            gap: 4px;
        }

        .seg-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-radius: 9px;
            transition: background 0.2s, color 0.2s;
        }

        .seg-btn.active {
            background: var(--border-color);
            color: #fff;
        }

        .range-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .range-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-blue);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        }

        .number-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            outline: none;
            user-select: text;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(230,57,70,0.15) 0%, rgba(0,180,216,0.15) 100%);
            border: 1px solid var(--accent-red);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-main {
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -1px;
        }

        .result-sub {
            font-size: 14px;
            color: #cbd5e1;
        }

        .badge {
            display: inline-block;
            align-self: center;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-calendar {
            background: var(--accent-purple);
            box-shadow: 0 4px 12px rgba(114, 9, 183, 0.3);
        }

        .btn-wakelock {
            background: var(--border-color);
            color: var(--text-secondary);
        }

        .btn-wakelock.active {
            background: var(--accent-green);
            color: #0b0e14;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .save-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>REZON <span>BOHEMIA</span></h1>
        <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
    </header>

    <div class="mode-switch">
        <button class="mode-btn active" id="tab-mode1" onclick="switchMode(1)">Temps pour 100%</button>
        <button class="mode-btn" id="tab-mode2" onclick="switchMode(2)">Batterie après X min</button>
    </div>

    <div class="card">
        <div class="section-label">Configuration de charge</div>
        <div class="segmented">
            <button class="seg-btn active" id="btn-solo" onclick="setParam('passenger', 'solo')">👤 Solo (<span id="label-solo-km">170</span> km)</button>
            <button class="seg-btn" id="btn-duo" onclick="setParam('passenger', 'duo')">👥 Duo (<span id="label-duo-km">140</span> km)</button>
        </div>
        <div class="segmented">
            <button class="seg-btn active" id="btn-borne" onclick="setParam('location', 'borne')">⚡ Borne (2h30)</button>
            <button class="seg-btn" id="btn-maison" onclick="setParam('location', 'maison')">🏠 Maison (8h)</button>
        </div>
    </div>

    <div class="card" id="form-mode1">
        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Batterie actuelle</span>
                <span class="range-value" id="battery-val">30%</span>
            </div>
            <input type="range" id="battery-range" min="0" max="100" value="30" oninput="updateCalculations()">
        </div>
    </div>

    <div class="card" id="form-mode2" style="display: none;">
        <div class="range-container">
            <div class="range-header">
                <span class="section-label">Batterie de départ</span>
                <span class="range-value" id="battery-val-m2">30%</span>
            </div>
            <input type="range" id="battery-range-m2" min="0" max="100" value="30" oninput="updateCalculations()">
        </div>

        <div class="range-container">
            <span class="section-label">Temps de charge disponible (minutes)</span>
            <input type="number" id="time-input" class="number-input" value="45" min="1" step="5" oninput="updateCalculations()">
        </div>
    </div>

    <div class="result-card">
        <div class="result-title" id="result-title">Temps de charge requis</div>
        <div class="result-main" id="result-main">1h 45m</div>
        <div class="result-sub" id="result-sub">Fin estimée à 16:15</div>
        <div class="badge" id="result-badge">Autonomie : +119 km (Total 170 km)</div>
    </div>

    <div class="action-group">
        <button class="btn-action btn-calendar" onclick="createICSAlarm()">
            📅 Ajouter rappel iOS (5 min avant)
        </button>

        <button class="btn-action btn-wakelock" id="wakelock-btn" onclick="toggleWakeLock()">
            ☀️ Maintenir l'écran allumé : OFF
        </button>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Réglages Autonomie</h2>
                <button style="background:none;border:none;color:#fff;font-size:20px;" onclick="toggleSettings(false)">✕</button>
            </div>
            <div class="input-row">
                <label style="font-size:13px;color:var(--text-secondary);">Autonomie Solo (km)</label>
                <input type="number" id="cfg-solo" class="number-input" style="font-size: 18px; padding: 8px;" value="170">
            </div>
            <div class="input-row">
                <label style="font-size:13px;color:var(--text-secondary);">Autonomie Duo (km)</label>
                <input type="number" id="cfg-duo" class="number-input" style="font-size: 18px; padding: 8px;" value="140">
            </div>
            <button class="save-btn" onclick="saveSettings()">Enregistrer</button>
        </div>
    </div>

    <script>
        let CONFIG = {
            range: { 
                solo: parseInt(localStorage.getItem('rezon_solo_km')) || 170, 
                duo: parseInt(localStorage.getItem('rezon_duo_km')) || 140 
            }
        };

        let state = { mode: 1, passenger: 'solo', location: 'borne' };
        let calculatedMinutesNeeded = 0;
        let wakeLock = null;

        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
            if(show) {
                document.getElementById('cfg-solo').value = CONFIG.range.solo;
                document.getElementById('cfg-duo').value = CONFIG.range.duo;
            }
        }

        function saveSettings() {
            const soloVal = parseInt(document.getElementById('cfg-solo').value) || 170;
            const duoVal = parseInt(document.getElementById('cfg-duo').value) || 140;
            CONFIG.range.solo = soloVal;
            CONFIG.range.duo = duoVal;
            localStorage.setItem('rezon_solo_km', soloVal);
            localStorage.setItem('rezon_duo_km', duoVal);
            updateLabels();
            updateCalculations();
            toggleSettings(false);
        }

        function updateLabels() {
            document.getElementById('label-solo-km').innerText = CONFIG.range.solo;
            document.getElementById('label-duo-km').innerText = CONFIG.range.duo;
        }

        function switchMode(newMode) {
            state.mode = newMode;
            document.getElementById('tab-mode1').classList.toggle('active', newMode === 1);
            document.getElementById('tab-mode2').classList.toggle('active', newMode === 2);
            document.getElementById('form-mode1').style.display = newMode === 1 ? 'flex' : 'none';
            document.getElementById('form-mode2').style.display = newMode === 2 ? 'flex' : 'none';
            updateCalculations();
        }

        function setParam(key, value) {
            state[key] = value;
            if(key === 'passenger') {
                document.getElementById('btn-solo').classList.toggle('active', value === 'solo');
                document.getElementById('btn-duo').classList.toggle('active', value === 'duo');
            } else if(key === 'location') {
                document.getElementById('btn-borne').classList.toggle('active', value === 'borne');
                document.getElementById('btn-maison').classList.toggle('active', value === 'maison');
            }
            updateCalculations();
        }

        function formatMinutes(totalMinutes) {
            const h = Math.floor(totalMinutes / 60);
            const m = Math.round(totalMinutes % 60);
            if (h === 0) return `${m} min`;
            return `${h}h ${m < 10 ? '0' : ''}${m}m`;
        }

        // --- NOUVELLE LOGIQUE DE CHARGE PRÉCISE (15.3 kWh) ---
        function getMinutesToCharge(startPct, endPct, location) {
            if (startPct >= endPct) return 0;
            
            if (location === 'maison') {
                // 8h pour 100% = 480 minutes -> 4.8 min par 1%
                return (endPct - startPct) * 4.8;
            } else {
                // Borne publique
                // Tranche 0% -> 80% : 90 minutes (1.125 min / %)
                // Tranche 80% -> 100% : 60 minutes (3.0 min / %)
                let minutes = 0;
                
                const seg1Start = Math.min(startPct, 80);
                const seg1End = Math.min(endPct, 80);
                if (seg1End > seg1Start) {
                    minutes += (seg1End - seg1Start) * (90 / 80);
                }

                const seg2Start = Math.max(startPct, 80);
                const seg2End = Math.max(endPct, 80);
                if (seg2End > seg2Start) {
                    minutes += (seg2End - seg2Start) * (60 / 20);
                }

                return minutes;
            }
        }

        function getFinalPctAfterMinutes(startPct, availableMinutes, location) {
            if (location === 'maison') {
                const pctGained = availableMinutes / 4.8;
                return Math.min(100, startPct + pctGained);
            } else {
                let currentSoc = startPct;
                let remainingMins = availableMinutes;

                // Si sous 80%, on consomme les minutes sur la tranche rapide (1.125 min/%)
                if (currentSoc < 80) {
                    const minsTo80 = (80 - currentSoc) * 1.125;
                    if (remainingMins <= minsTo80) {
                        return currentSoc + (remainingMins / 1.125);
                    } else {
                        currentSoc = 80;
                        remainingMins -= minsTo80;
                    }
                }

                // Tranche lente au-dessus de 80% (3 min/%)
                if (remainingMins > 0 && currentSoc >= 80) {
                    const pctGained = remainingMins / 3.0;
                    currentSoc = Math.min(100, currentSoc + pctGained);
                }

                return currentSoc;
            }
        }

        function updateCalculations() {
            const maxRange = CONFIG.range[state.passenger];

            if (state.mode === 1) {
                const currentPct = parseInt(document.getElementById('battery-range').value);
                document.getElementById('battery-val').innerText = `${currentPct}%`;
                
                calculatedMinutesNeeded = getMinutesToCharge(currentPct, 100, state.location);

                const now = new Date();
                const endTime = new Date(now.getTime() + calculatedMinutesNeeded * 60000);
                const endStr = endTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const pctToCharge = 100 - currentPct;
                const kmMissing = Math.round((pctToCharge / 100) * maxRange);
                const currentKm = Math.round((currentPct / 100) * maxRange);

                document.getElementById('result-title').innerText = "Temps pour atteindre 100%";
                document.getElementById('result-main').innerText = formatMinutes(calculatedMinutesNeeded);
                document.getElementById('result-sub').innerText = currentPct === 100 ? "Batterie déjà pleine !" : `Fin estimée à ${endStr}`;
                document.getElementById('result-badge').innerText = `Actuel : ${currentKm} km | À charger : +${kmMissing} km`;
            } else {
                const startPct = parseInt(document.getElementById('battery-range-m2').value);
                document.getElementById('battery-val-m2').innerText = `${startPct}%`;

                calculatedMinutesNeeded = parseInt(document.getElementById('time-input').value) || 0;

                const finalPctRaw = getFinalPctAfterMinutes(startPct, calculatedMinutesNeeded, state.location);
                const finalPct = Math.round(finalPctRaw);
                const pctGained = Math.max(0, finalPct - startPct);

                const finalKm = Math.round((finalPct / 100) * maxRange);
                const gainedKm = Math.round((pctGained / 100) * maxRange);

                document.getElementById('result-title').innerText = "Niveau après la charge";
                document.getElementById('result-main').innerText = `${finalPct}%`;
                document.getElementById('result-sub').innerText = finalPct >= 100 ? "Recharge complète !" : `Gain de +${pctGained}% de batterie`;
                document.getElementById('result-badge').innerText = `Autonomie finale : ${finalKm} km (+${gainedKm} km)`;
            }
        }

        function createICSAlarm() {
            if (calculatedMinutesNeeded <= 0) return;

            const now = new Date();
            const endDate = new Date(now.getTime() + calculatedMinutesNeeded * 60000);

            function formatDate(d) {
                return d.toISOString().replace(/-|:|\.\d+/g, "");
            }

            const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Rezon Bohemia//Charge Tracker//FR
BEGIN:VEVENT
SUMMARY:⚡ Fin de charge Rezon Bohemia
DESCRIPTION:Votre recharge s'achève dans 5 minutes !
DTSTART:${formatDate(now)}
DTEND:${formatDate(endDate)}
BEGIN:VALARM
TRIGGER:-PT5M
ACTION:DISPLAY
DESCRIPTION:Fin de charge Rezon dans 5 min !
END:VALARM
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'fin_de_charge.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function toggleWakeLock() {
            const btn = document.getElementById('wakelock-btn');
            if (!('wakeLock' in navigator)) {
                alert("Option non supportée sur ce navigateur.");
                return;
            }

            if (wakeLock !== null) {
                await wakeLock.release();
                wakeLock = null;
                btn.classList.remove('active');
                btn.innerText = "☀️ Maintenir l'écran allumé : OFF";
            } else {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    btn.classList.add('active');
                    btn.innerText = "☀️ Écran maintenu allumé : ON";
                } catch (err) {
                    console.error(err);
                }
            }
        }

        updateLabels();
        updateCalculations();
    </script>
</body>
</html>
